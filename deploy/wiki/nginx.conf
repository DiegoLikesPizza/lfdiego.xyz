# The wikis under lfdiego.xyz/wiki/. Include this inside the lfdiego.xyz server block:
#     include snippets/lfdiego-wiki.conf;
# deploy/wiki/deploy.sh keeps /etc/nginx/snippets/lfdiego-wiki.conf in sync with this file.
#
# /wiki/ itself is the Next.js hub page and stays with the static site.
# Each wiki is an engine instance started with --base-path, so the path is passed through unchanged
# (no URI after the port in proxy_pass). ^~ stops regex locations (e.g. for *.css) from taking over.

location ^~ /wiki/guides/ {
    proxy_pass http://127.0.0.1:8091;
    include snippets/lfdiego-wiki-proxy.conf;
}
location ^~ /wiki/java27/ {
    proxy_pass http://127.0.0.1:8092;
    include snippets/lfdiego-wiki-proxy.conf;
}
location ^~ /wiki/kotlin/ {
    proxy_pass http://127.0.0.1:8093;
    include snippets/lfdiego-wiki-proxy.conf;
}
location = /wiki/guides { return 301 /wiki/guides/; }
location = /wiki/java27 { return 301 /wiki/java27/; }
location = /wiki/kotlin { return 301 /wiki/kotlin/; }

# The guides used to be Next.js pages at /wiki/<guide>/. (/wiki/kotlin/ is now the Kotlin wiki.)
location ~ ^/wiki/(git|github|java|javascript|ides|ai-prompting)/?$ {
    return 301 /wiki/guides/wiki/$1;
}
